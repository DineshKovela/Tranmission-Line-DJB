<script>
/* ==== hydro.js ==== */
/* hydroSolve.js - steady / extended-period network hydraulics for the Sonia Vihar transmission mains.
   Equations follow Model Card W6:
     pipe headloss  h_f = 10.67 L Q^1.852 / (C^1.852 D^4.87)           (Hazen-Williams, SI)
     junction       sum Q_in - sum Q_out - q_demand - q_leak = 0
     pump           H_p = a - b Q^c   (check valve; off => Q = 0)
     valve closed   Q = 0 (link removed)
     reservoir      A dH/dt = Q_in - Q_out
     demand         q_i(t) = q_base_i * m(t)         (pressure-dependent: Wagner PDA)
     leak emitter   Q_leak = C_e (H - z)^0.5          (Model Card W4)

(function (G) {
  const HW_EXP = 1.852, D_EXP = 4.87;
  const PUMP_DEFAULT = {
    "PUMP-001": { a: 44, b: 1.14, c: 2 },    // South Delhi main duty point ~3.5 m3/s @ 30 m
    "PUMP-002": { a: 42, b: 9.72, c: 2 },    // Tahirpur main duty point ~1.2 m3/s @ 28 m
    "PUMP-003": { a: 40, b: 12.0, c: 2 },    // Shastri Park main duty point ~1.0 m3/s @ 28 m
  };
  const EXIT_DESIGN = { "EXIT-E05": 0.60, "EXIT-E06": 0.10, "EXIT-E07": 0.10, "EXIT-E24": 1.80, "EXIT-E65": 0.50 }; // m3/s through the boundary at baseline
  const P_EXIT0 = 26;      // assumed pressure head (m) at the exits at baseline, used to calibrate the orifice coefficient
  const P_REQ = 15, P_MIN = 0;  // PDA service head
  const H_CWR_ABOVE_GROUND = 4.5;

  function diurnal(hour) {   // demand multiplier m(t), mean ~1
    const h = ((hour % 24) + 24) % 24;
    const g = (mu, s) => Math.exp(-Math.pow(Math.min(Math.abs(h - mu), 24 - Math.abs(h - mu)) / s, 2));
    const raw = 0.55 + 0.55 * g(7.5, 2.0) + 0.45 * g(19.5, 2.2);
    return raw / 1.0 / 1.0;
  }
  const MEAN_M = (() => { let s = 0; for (let i = 0; i < 240; i++) s += diurnal(i / 10); return s / 240; })();
  function m(hour) { return diurnal(hour) / MEAN_M; }

  function buildNetwork(pack) {
    const nodes = {}; const order = [];
    const add = (n) => { nodes[n.id] = n; order.push(n.id); };
    pack.nodes.forEach(n => add({ id: n.id, name: n.name, kind: n.kind, x: n.x, y: n.y, z: n.z_center, ground: n.ground, dma: n.dma, res: n.res_id, demand0: 0, exitQ: 0, fixed: false, head: null }));
    const wtp = nodes["WTP"];
    add({ id: "CWR", name: "Clear-water reservoir (WTP)", kind: "source", x: wtp.x - 60, y: wtp.y + 30, z: wtp.ground, ground: wtp.ground, fixed: true, head: wtp.ground + H_CWR_ABOVE_GROUND, demand0: 0, exitQ: 0 });
    add({ id: "WTP-SD", name: "WTP discharge - South Delhi main", kind: "manifold", x: wtp.x - 35, y: wtp.y - 20, z: wtp.z, ground: wtp.ground, demand0: 0, exitQ: 0 });
    add({ id: "WTP-SP", name: "WTP discharge - Shastri Park main", kind: "manifold", x: wtp.x - 35, y: wtp.y - 45, z: wtp.z, ground: wtp.ground, demand0: 0, exitQ: 0 });
    pack.dmas.forEach(d => { nodes[d.supply_node].demand0 = d.base_demand_m3h_gis / 3600; nodes[d.supply_node].supplies = d.id; });

    pack.edges.forEach(e => {
      let from = e.from; if (e.main === "SD" && from === "WTP") from = "WTP-SD"; if (e.main === "SP" && from === "WTP") from = "WTP-SP";
      if (e.main === "GRAV" && from === "WTP") from = "CWR";
      const D = e.dn / 1000, A = Math.PI * D * D / 4; const Ktot = e.items.reduce((s, it) => s + (it.type === "valve" ? 0.3 : 0.15), 0);   // minor-loss K: open gate valve 0.3, flow meter 0.15
      links.push({ id: e.id, type: "pipe", from, to: e.to, L: e.length, D, C: 120, closed: e.status === "closed", main: e.main, dn: e.dn, K: Ktot, km: Ktot / (2 * 9.81 * A * A) });
    });

      const p = PUMP_DEFAULT[id]; links.push({ id, type: "pump", from: "CWR", to, a: p.a, b: p.b, c: p.c, on: true, closed: false, main: to === "WTP" ? "TAH" : to === "WTP-SD" ? "SD" : "SP" });
    });

    net.tanks = {};
    pack.nodes.filter(n => n.res_id).forEach(n => { net.tanks[n.id] = { id: n.res_id, node: n.id, A: Math.PI * 12 * 12, hmax: 5.5, level0: 3.5, target: 3.5 }; });

  }

  const METHOD = { m: "HW" };

  function linkFlow(l, dH, ctx) {

      reservoir: f => { const z = ctx.kpi(S.W, JSON.stringify({ resid_amber: S.resid })).zones; const q = Object.values(z).find(q => q.res_id === f.id); const bad = q && q.res_rate != null && (q.res_rate < ctx.limits.res_fall_rate_m_per_h || q.res_level < ctx.limits.res_min_m); const warn = q && q.res_level < ctx.limits.res_warn_m; return { color: bad ? COL.red : warn ? COL.amber : COL.green, level: q && q.res_level != null ? Math.min(1, q.res_level / 5.5) : null }; },
      pump: f => { const p = ctx.latest("PMP-00" + f.id.slice(-1), "pump_status"); return { color: p && p.value != null ? (p.value < .25 ? COL.red : p.value < .99 ? COL.amber : COL.green) : COL.grey }; },
    };
    map = new GisMap(document.getElementById("map"), ctx, { styles: st, layers: { sensors: true, meters: false, valves: true }, tip: f => { if (f.type === "dma") { const q = ctx.kpi(S.W, JSON.stringify({ resid_amber: S.resid })).zones[f.id]; return f.id + " · " + q.status + "\nResidual " + fmtN(q.residual_pct, 1) + " % · Pmin " + fmtN(q.pmin, 1) + " m"; } return f.type + " " + f.id; }, onSelect: (f, user) => { const zid = zoneOfFeature(f, ctx); if (zid) { S.zone = zid; render(ctx); } if (user) Bus.emit("select", { asset: f.asset, feature: f.gis, source: "W1" }); } });
    Bus.on("select", p => { if (!p) return; const f = map.byId[p.feature] || map.byId[p.asset]; if (f) { map.select(f); map.flyTo(f, Math.max(map.k, .3)); } });
    document.getElementById("win").onchange = e => { S.W = +e.target.value; ctx.cache = {}; render(ctx); };
    document.getElementById("svc").onchange = e => { ctx.limits.service_head_m = +e.target.value; ctx.limits.service_head_crit_m = e.target.value === "12" ? 7 : 4; ctx.cache = {}; render(ctx); };
    document.getElementById("resid").onchange = e => { S.resid = +e.target.value; ctx.cache = {}; render(ctx); };
    map.legend([[COL.blue, "transmission main (normal flow)"], [COL.green, "sensor / pump / reservoir in limits"], [COL.amber, "warning"], [COL.red, "critical / pump fail / low level"], ["#16202e", "junction"]]);
    window.__w1 = { S, map };
  }
  boot({ title: "W1 · Network Operations Dashboard", sub: "Zone mass balance · pressure KPIs · alerts · Sonia Vihar transmission network (Model Card W1)", html, init, render, mainStyle: "grid-template-columns:minmax(440px,1fr) minmax(460px,1.25fr)" });
})();
